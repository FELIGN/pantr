name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Cache Ruff cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ruff
          key: ${{ runner.os }}-ruff-${{ hashFiles('ruff.toml', '.ruff.toml') }}
          restore-keys: |
            ${{ runner.os }}-ruff-

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-

      - name: Create venv and install dev deps (on cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          . .venv/bin/activate
          make ruff-lint

      - name: Ruff formatting check
        run: |
          . .venv/bin/activate
          make ruff-format-check

      - name: Import boundary check (import-linter)
        run: |
          . .venv/bin/activate
          make import-lint

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Cache mypy cache
        uses: actions/cache@v5
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml', 'mypy.ini') }}
          restore-keys: |
            ${{ runner.os }}-mypy-

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-

      - name: Create venv and install dev deps (on cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check
        run: |
          . .venv/bin/activate
          make type-check

  tests:
    name: Tests with coverage
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-

      - name: Cache Numba compiled objects
        uses: actions/cache@v5
        with:
          path: |
            src/pantr/basis/__pycache__
            src/pantr/bezier/__pycache__
            src/pantr/bspline/__pycache__
          key: ${{ runner.os }}-numba-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-numba-${{ steps.setup-python.outputs.python-version }}-

      - name: Install OpenMPI
        run: |
          # The runner images do not name a mirror in sources.list: they point apt at
          # a mirror *list*, `mirror+file:/etc/apt/apt-mirrors.txt`, whose first entry
          # is azure.archive.ubuntu.com. That host intermittently stops answering, and
          # apt then spends a full timeout per index file before falling back to the
          # canonical mirror -- which is why this step has taken 16 s and 240 s on
          # identical input, and once sat past 38 minutes with a log full of `Ign`
          # lines. Replacing the list with a single entry removes the retry round: apt
          # either reaches the mirror or fails, and does not spend minutes finding out.
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update -q
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Create venv and install dev deps (on cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with JIT (populates Numba cache)
        run: |
          . .venv/bin/activate
          make test

      # On the full matrix rather than once, because an example can drift from the code
      # on any version and a numpy release that prints a value differently breaks it on
      # one leg only. A step here rather than a job of its own: it reuses this job's
      # venv, runs in under a second, and wants no coverage. The target sets
      # NUMBA_DISABLE_JIT=1 -- see the Makefile for why.
      - name: Run doctests
        run: |
          . .venv/bin/activate
          make doctest

      - name: Run pytest with coverage
        run: |
          . .venv/bin/activate
          make coverage

      - name: Upload coverage xml
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-py${{ matrix.python-version }}-run${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: error

  docs:
    name: Build documentation
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Sphinx doctrees
        uses: actions/cache@v5
        with:
          path: docs/_build/doctrees
          key: ${{ runner.os }}-sphinx-${{ hashFiles('docs/**/*.md', 'docs/conf.py', 'pyproject.toml', 'src/**/*.py') }}

      - name: Cache intersphinx inventories
        id: cache-intersphinx
        uses: actions/cache@v5
        with:
          path: docs/_intersphinx
          key: ${{ runner.os }}-intersphinx-${{ hashFiles('docs/conf.py') }}
          restore-keys: |
            ${{ runner.os }}-intersphinx-

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'docs/**/*.md', 'docs/conf.py') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-

      - name: Create venv and install docs deps (on cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Download intersphinx inventories (on cache miss)
        if: steps.cache-intersphinx.outputs.cache-hit != 'true'
        run: |
          mkdir -p docs/_intersphinx
          curl -fsSL --retry 3 --retry-delay 2 https://docs.python.org/3/objects.inv \
            -o docs/_intersphinx/python.inv || rm -f docs/_intersphinx/python.inv
          curl -fsSL --retry 3 --retry-delay 2 https://numpy.org/doc/stable/objects.inv \
            -o docs/_intersphinx/numpy.inv || rm -f docs/_intersphinx/numpy.inv
          curl -fsSL --retry 3 --retry-delay 2 https://docs.scipy.org/doc/scipy/objects.inv \
            -o docs/_intersphinx/scipy.inv || rm -f docs/_intersphinx/scipy.inv
          curl -fsSL --retry 3 --retry-delay 2 https://matplotlib.org/stable/objects.inv \
            -o docs/_intersphinx/matplotlib.inv || rm -f docs/_intersphinx/matplotlib.inv

      - name: Build docs
        run: |
          . .venv/bin/activate
          make docs SPHINXOPTS="-W --keep-going -j auto"

  mpi-tests:
    name: MPI tests (mpiexec)
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that exercises the real distributed stack under multiple ranks. It
    # builds mpi4py from source against the system OpenMPI -- the prebuilt wheels are not
    # guaranteed to match the system launcher's wire protocol. PANTR_RUN_MPI enables the
    # otherwise-skipped tests under tests/mpi/.
    env:
      PANTR_RUN_MPI: "1"
      PIP_NO_BINARY: "mpi4py"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install OpenMPI
        run: |
          # The runner images do not name a mirror in sources.list: they point apt at
          # a mirror *list*, `mirror+file:/etc/apt/apt-mirrors.txt`, whose first entry
          # is azure.archive.ubuntu.com. That host intermittently stops answering, and
          # apt then spends a full timeout per index file before falling back to the
          # canonical mirror -- which is why this step has taken 16 s and 240 s on
          # identical input, and once sat past 38 minutes with a log full of `Ign`
          # lines. Replacing the list with a single entry removes the retry round: apt
          # either reaches the mirror or fails, and does not spend minutes finding out.
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update -q
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-mpi-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-mpi-

      - name: Create venv and install (with mpi4py built from source, on cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify mpi4py matches the launcher
        run: |
          . .venv/bin/activate
          mpiexec --oversubscribe -n 2 python -c "from mpi4py import MPI; assert MPI.COMM_WORLD.size == 2"

      - name: Run MPI smoke tests (2 ranks)
        run: |
          . .venv/bin/activate
          mpiexec --oversubscribe -n 2 python -m pytest tests/mpi/ --no-cov -p no:cacheprovider

      - name: Run MPI smoke tests (3 ranks)
        run: |
          . .venv/bin/activate
          mpiexec --oversubscribe -n 3 python -m pytest tests/mpi/ --no-cov -p no:cacheprovider

  adversarial-sweep:
    name: Adversarial sweep (Numba bounds check)
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that compiles the Layer-3 kernels with bounds checking on. It needs a
    # job of its own because NUMBA_BOUNDSCHECK is not part of the Numba cache key, so it is
    # silently ignored for a cache=True kernel that was already compiled without it -- and
    # every pantr kernel is cache=True. The test hands the sweep a fresh cache directory
    # per run, which means recompiling everything it touches, hence the separate job rather
    # than a step in `tests`. PANTR_RUN_SWEEP enables the otherwise-skipped test.
    env:
      PANTR_RUN_SWEEP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-sweep-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-sweep-

      - name: Create venv and install (on cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the bounds-checked smoke sweep
        run: |
          . .venv/bin/activate
          python -m pytest tests/test_adversarial_sweep.py -v --no-cov -p no:cacheprovider
