repos:
  # General file quality hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # Ruff linting (conditional on branch)
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .pre-commit-hooks/conditional_check.py
        language: system
        args: ['ruff', 'check', '--fix']
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: .pre-commit-hooks/conditional_check.py
        language: system
        args: ['ruff', 'format']
        types: [python]
        pass_filenames: false

  # MyPy type checking (conditional on branch)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .pre-commit-hooks/conditional_check.py
        language: python
        args: ['mypy', '--config-file=mypy.ini', 'src', 'tests']
        types: [python]
        pass_filenames: false
        additional_dependencies: [
          'mypy>=1.10,<2',
          # Upper-bounded to match what the project environment resolves.
          # numpy 2.5 requires Python 3.12 and its stubs use PEP 695 `type`
          # statements, which mypy cannot parse while mypy.ini asks for 3.11.
          # Drop the bound once the Python floor moves to 3.12.
          'numpy>=1.26,<2.5',
          'scipy>=1.11,<2',
          # Mirrors the pyproject pin, which documents why the upper bound
          # exists: 0.66 broke mypy's view of get_num_threads and of
          # config.NUMBA_NUM_THREADS.
          'numba>=0.63,<0.66',
          'threadpoolctl>=3.0',
          # tests/test_tutorials.py imports matplotlib.pyplot; without it the
          # hook's isolated environment cannot resolve it and every commit
          # touching a .py file fails, while a real mypy run passes.
          'matplotlib>=3.7,<4',
        ]
