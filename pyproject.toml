[build-system]
# scikit-build-core replaces hatchling because the wheel now contains a compiled
# extension. nanobind is a BUILD requirement, not a runtime one: the extension
# links it statically (NB_STATIC), so nothing imports nanobind at run time.
requires = ["scikit-build-core>=0.10", "nanobind>=2.14"]
build-backend = "scikit_build_core.build"

[project]
name = "pantr"
description = "Polynomial And NURBS Toolkit"
readme = "README.md"
requires-python = ">=3.11, <3.15"
license = "MIT"
# `licenses/` carries Eigen's own licence files. The extension statically
# contains Eigen as of 2026-08-21 and Eigen is MPL-2.0, whose section 3.2
# requires the Executable Form to carry the licence; see licenses/README.md.
license-files = ["LICENSE", "licenses/README.md", "licenses/eigen/*"]
authors = [{ name = "Pablo Antolin", email = "pablo.antolin@epfl.ch" }]
keywords = [
  "nurbs",
  "b-spline",
  "bezier",
  "bernstein",
  "spline",
  "isogeometric-analysis",
  "cad",
  "geometric-modeling",
  "quadrature",
  "scientific-computing",
]
dynamic = ["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
# Always-on runtime dependencies. Optional features (MPI, METIS partitioning,
# visualization) live in `[project.optional-dependencies]` and are opt-in.
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.15,<2",  # 1.15 added BarycentricInterpolator's `rng`, which Lagrange tabulation needs to be reproducible
  "numba>=0.63,<0.66",  # 0.66.0 broke mypy's view of get_num_threads/config.NUMBA_NUM_THREADS
  "threadpoolctl>=3.0",
]

[project.optional-dependencies]
mpi = [
  "mpi4py>=3.1,<5",
]
metis = [
  "pymetis>=2025.2",
]
viz = [
  "pyvista>=0.43,<1",
]
docs = [
  "sphinx>=7.2,<8",
  "furo>=2024.1",
  "myst-parser>=2.0,<3",
  "linkify-it-py>=2.0,<3",
  # matplotlib is used only by the 2-D plots in the tutorial scripts (not by pantr
  # itself, whose rendering is pyvista-based); pinned here so the gallery always builds.
  "matplotlib>=3.7,<4",
  # Sphinx-Gallery executes the `tutorials/` scripts and embeds their output; pyvista
  # renders the 3-D scenes off-screen and the trame stack (+ nest_asyncio2)
  # exports them as interactive vtk.js widgets. On headless builders docs/conf.py
  # starts Xvfb and VTK renders via Mesa software GL (RTD installs them through
  # `.readthedocs.yaml`; GitHub's ubuntu-latest ships them).
  "sphinx-gallery>=0.15,<1",
  "sphinx-design>=0.5,<1",
  # Bibliographic citations ({cite} roles + the References page bibliography).
  # Pinned <2.7: 2.7+ requires Sphinx >=8, but the docs toolchain is pinned to Sphinx 7.
  "sphinxcontrib-bibtex>=2.6,<2.7",
  "pantr[viz]",
  "trame>=3,<4",
  "trame-vtk>=2,<3",
  "trame-vuetify>=2,<4",
  "nest-asyncio2>=1,<2",
]
# `dev` pulls in every optional feature extra so a single
# `pip install -e ".[dev]"` yields a complete contributor environment and CI runs
# the full suite (no silently skipped viz/MPI/METIS tests).
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4,<6",
  "pytest-xdist>=3,<4",
  "mypy>=1.10,<2",
  "ruff>=0.12.0,<0.13",
  "pre-commit>=3.6,<4",
  "import-linter>=2.0,<3",
  "pantr[mpi]",
  "pantr[metis]",
  "pantr[viz]",
  "pantr[docs]",
]

[project.urls]
Homepage = "https://github.com/FELIGN/pantr"
Documentation = "https://pantr.readthedocs.io"
Source = "https://github.com/FELIGN/pantr"
Issues = "https://github.com/FELIGN/pantr/issues"

[tool.scikit-build]
# The pure-Python package ships as it always did; CMake adds the extension
# alongside it (see cpp/bindings/CMakeLists.txt for the install destination).
wheel.packages = ["src/pantr"]
cmake.version = ">=3.25"
cmake.build-type = "Release"
# Out of the Python build: the C++ tests and the benchmark are built by
# CMakePresets, not by pip. Eigen is no longer in that category -- the shipped
# extension includes it (see cmake/PantrDependencies.cmake), so a `pip install`
# does fetch it, which is what makes the persistent build-dir below load-bearing
# rather than merely nice.
cmake.define.PANTR_BUILD_PYTHON = "ON"
cmake.define.PANTR_BUILD_TESTS = "OFF"
cmake.define.PANTR_BUILD_BENCHMARK = "OFF"
cmake.define.PANTR_WERROR = "ON"
# OFF explicitly, because the default is PROJECT_IS_TOP_LEVEL and scikit-build-core
# configures this project directly, which makes it ON. Measured: with it ON the
# wheel gains the 18 C++ headers and three CMake package files, and the config
# lands under site-packages/lib/cmake where CMake does not look. Whether a pip
# install should also ship the C++ package is a separate decision from having
# install rules at all.
#
# Decided 2026-08-27: it stays OFF, and the two audiences are served by two routes.
# pip serves the Python consumer; a C++ consumer takes pantr through a CMake install
# (later, a conda package). The deciding fact is that the exported target carries a
# hard `find_dependency(Eigen3)` and the wheel does not carry Eigen, so a
# wheel-shipped `find_package(pantr)` would fail on any machine that has not
# installed Eigen separately -- which is the default for someone installing by pip.
# Shipping headers that cannot be configured against is worse than not shipping them.
cmake.define.PANTR_INSTALL = "OFF"
# Keep the symbol table in the INSTALLED extension. This prototype exists to be
# measured, and a stripped module gives `perf` nothing to attribute time to and a
# segfault nothing to build a backtrace from.
#
# It takes both this and NOSTRIP in cpp/bindings/CMakeLists.txt, because there are
# two strippers and either one is enough on its own. nanobind's
# `nanobind_add_module` strips at LINK time unless told not to; scikit-build-core
# strips again at INSTALL time, and its default for that is derived from
# `cmake.build-type` -- true for Release and MinSizeRel, which is exactly the
# build being measured. Verified: with NOSTRIP alone the build tree's .so carried
# 364 symbols while the installed one still reported "no symbols" to `nm`.
#
# The cost is disk. It does not change a single generated instruction, so no
# measurement is affected by its presence.
install.strip = false
# A persistent build directory, so an editable rebuild is incremental. Without
# it every `pip install -e .` reconfigures from scratch and re-clones Eigen,
# which is the single most painful part of the worktree workflow.
build-dir = "build/skbuild/{wheel_tag}"
sdist.exclude = ["build", "design/_memory", ".github"]

# Single source of truth for the version: `__version__` in the package __init__.
# The explicit pattern is required because the assignment carries a type
# annotation (`__version__: Final[str] = "..."`), which no default regex matches.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/pantr/__init__.py"
regex = '^__version__[^=]*=\s*"(?P<value>[^"]+)"'

[tool.importlinter]
root_package = "pantr"

[[tool.importlinter.contracts]]
name = "Serial core must not import pantr.mpi"
type = "forbidden"
source_modules = [
  "pantr.basis",
  "pantr.bezier",
  "pantr.bspline",
  "pantr.cad",
  "pantr.change_basis",
  "pantr.geometry",
  "pantr.grid",
  "pantr.quad",
  "pantr.tolerance",
  "pantr.transform",
  "pantr.viz",
]
forbidden_modules = ["pantr.mpi"]

# pantr._backend answers "which backend is selected". The map from that answer to
# the kernels themselves lives beside the kernels (pantr.basis._basis_backend and
# one such module per ported package), because a catalogue has to import what it
# hands out and its consumers import the policy -- so a catalogue here would close
# a cycle that only lazy imports could hold open, one more per kernel ported.
#
# Indirect imports are allowed because every module reaches every other through
# pantr/__init__.py: the probe `import pantr._pantr_cpp` pulls in the root package,
# whose __init__ imports the library. The rule this contract exists for is about
# the DIRECT dependency, which is the one a future edit would add.
[[tool.importlinter.contracts]]
name = "Backend policy must not import the library it selects for"
type = "forbidden"
source_modules = ["pantr._backend"]
forbidden_modules = ["pantr.*"]
allow_indirect_imports = true
